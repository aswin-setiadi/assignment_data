apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
      - name: producer
        image: email-producer:latest
        imagePullPolicy: Never
        env:
        - name: KAFKA_BROKER
          value: kafka:9092
        - name: SOURCE_PATH
          value: data/test
        - name: CYCLE_DATA
          value: "true"
        - name: SLEEP
          value: "0"